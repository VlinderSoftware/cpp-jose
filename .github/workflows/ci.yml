name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux GCC ─────────────────────────────────────────────────────
          - name: "Linux GCC Debug"
            os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            backend: OpenSSL
            build_type: Debug
            coverage: true
            coverage_tool: lcov-gcov
          - name: "Linux GCC Release"
            os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            backend: OpenSSL
            build_type: Release
            coverage: false
          # ── Linux Clang ───────────────────────────────────────────────────
          - name: "Linux Clang Debug"
            os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            backend: OpenSSL
            build_type: Debug
            coverage: true
            coverage_tool: llvm-cov-instr
          - name: "Linux Clang Release"
            os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            backend: OpenSSL
            build_type: Release
            coverage: false
          # ── macOS Clang ───────────────────────────────────────────────────
          - name: "macOS Clang Debug"
            os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            backend: OpenSSL
            build_type: Debug
            coverage: true
            coverage_tool: llvm-cov-instr
          - name: "macOS Clang Release"
            os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            backend: OpenSSL
            build_type: Release
            coverage: false
          # ── Windows MSVC ──────────────────────────────────────────────────
          - name: "Windows MSVC CNG Debug"
            os: windows-latest
            compiler: msvc
            backend: CNG
            build_type: Debug
            coverage: true
            coverage_tool: opencppcoverage
          - name: "Windows MSVC CNG Release"
            os: windows-latest
            compiler: msvc
            backend: CNG
            build_type: Release
            coverage: false
          - name: "Windows MSVC OpenSSL Debug"
            os: windows-latest
            compiler: msvc
            backend: OpenSSL
            build_type: Debug
            coverage: true
            coverage_tool: opencppcoverage
          - name: "Windows MSVC OpenSSL Release"
            os: windows-latest
            compiler: msvc
            backend: OpenSSL
            build_type: Release
            coverage: false
          # ── Windows ClangCL ───────────────────────────────────────────────
          - name: "Windows ClangCL CNG Debug"
            os: windows-latest
            compiler: clang-cl
            backend: CNG
            build_type: Debug
            coverage: true
            coverage_tool: opencppcoverage
          - name: "Windows ClangCL CNG Release"
            os: windows-latest
            compiler: clang-cl
            backend: CNG
            build_type: Release
            coverage: false
          - name: "Windows ClangCL OpenSSL Debug"
            os: windows-latest
            compiler: clang-cl
            backend: OpenSSL
            build_type: Debug
            coverage: true
            coverage_tool: opencppcoverage
          - name: "Windows ClangCL OpenSSL Release"
            os: windows-latest
            compiler: clang-cl
            backend: OpenSSL
            build_type: Release
            coverage: false

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev lcov clang llvm

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja openssl@3 lcov llvm
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "LLVM_PREFIX=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate OpenSSL (Windows)
        if: ${{ runner.os == 'Windows' && matrix.backend == 'OpenSSL' }}
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\OpenSSL",
            "C:\Program Files\OpenSSL-Win64",
            "C:\OpenSSL-Win64"
          )
          $root = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $root) {
            choco install openssl -y --no-progress
            $root = "C:\Program Files\OpenSSL-Win64"
          }
          "OPENSSL_ROOT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install OpenCppCoverage (Windows MSVC)
        if: matrix.coverage_tool == 'opencppcoverage'
        shell: pwsh
        run: choco install opencppcoverage -y --no-progress

      - name: Configure CMake
        shell: bash
        run: |
          [[ -n "${{ matrix.cc }}" ]] && export CC="${{ matrix.cc }}"
          [[ -n "${{ matrix.cxx }}" ]] && export CXX="${{ matrix.cxx }}"

          EXTRA_ARGS=()
          [[ "${{ matrix.compiler }}" == "clang-cl" ]] && \
            EXTRA_ARGS+=("-DCMAKE_C_COMPILER=clang-cl" "-DCMAKE_CXX_COMPILER=clang-cl")
          [[ -n "$OPENSSL_ROOT_DIR" ]] && \
            EXTRA_ARGS+=("-DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR")

          # Coverage instrumentation flags (not needed for opencppcoverage — it instruments at run time)
          case "${{ matrix.coverage_tool }}" in
            lcov-gcov|lcov-llvm)
              EXTRA_ARGS+=("-DCMAKE_CXX_FLAGS=--coverage" "-DCMAKE_EXE_LINKER_FLAGS=--coverage")
              ;;
            llvm-cov-instr)
              # Native Clang source-based coverage (Linux/macOS only).
              # ClangCL Windows uses opencppcoverage instead.
              EXTRA_ARGS+=("-DCMAKE_CXX_FLAGS=-fprofile-instr-generate -fcoverage-mapping")
              EXTRA_ARGS+=("-DCMAKE_EXE_LINKER_FLAGS=-fprofile-instr-generate")
              ;;
          esac

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DJOSE_BACKEND=${{ matrix.backend }} \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            "${EXTRA_ARGS[@]}"

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      # Normal test run for all non-opencppcoverage configurations
      - name: Test
        if: matrix.coverage_tool != 'opencppcoverage'
        shell: bash
        run: |
          [[ "${{ matrix.coverage_tool }}" == "llvm-cov-instr" ]] && \
            export LLVM_PROFILE_FILE="${GITHUB_WORKSPACE}/build/%p-%m.profraw"
          ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      # OpenCppCoverage wraps the test executable directly
      - name: Test (OpenCppCoverage)
        if: matrix.coverage_tool == 'opencppcoverage'
        shell: pwsh
        run: |
          $testExe = Get-ChildItem -Path build -Recurse -Filter jose_tests.exe |
                     Select-Object -First 1 -ExpandProperty FullName
          & "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe" `
              --export_type cobertura:build/coverage.xml `
              --sources src `
              --sources include `
              -- $testExe

      # ── Coverage report generation ────────────────────────────────────────

      - name: Coverage report (GCC / lcov)
        if: matrix.coverage_tool == 'lcov-gcov'
        run: |
          lcov --capture --directory build --output-file build/coverage.info --ignore-errors source,inconsistent
          lcov --remove build/coverage.info '/usr/*' '*/Catch2/*' '*/nlohmann*' \
               --ignore-errors unused \
               --output-file build/coverage.info
          lcov --list build/coverage.info
          echo "COVERAGE_FILE=build/coverage.info" >> "$GITHUB_ENV"
          echo "COVERAGE_DATA_FILE=build/coverage.info" >> "$GITHUB_ENV"

      - name: Coverage report (Clang / llvm-cov instrumentation, Linux)
        if: matrix.coverage_tool == 'llvm-cov-instr' && runner.os == 'Linux'
        run: |
          profraw_files=()
          while IFS= read -r f; do profraw_files+=("$f"); done \
            < <(find build -name "*.profraw")
          llvm-profdata merge -sparse "${profraw_files[@]}" -o build/coverage.profdata
          test_exe=$(find build -name 'jose_tests' -type f | head -1)
          llvm-cov export "$test_exe" \
            -instr-profile=build/coverage.profdata \
            -format=lcov \
            "--ignore-filename-regex=(build/_deps|tests)/" \
            > build/coverage.lcov
          echo "COVERAGE_FILE=build/coverage.lcov" >> "$GITHUB_ENV"
          echo "COVERAGE_DATA_FILE=build/coverage.lcov" >> "$GITHUB_ENV"

      - name: Coverage report (Clang / llvm-cov instrumentation, macOS)
        if: matrix.coverage_tool == 'llvm-cov-instr' && runner.os == 'macOS'
        run: |
          profraw_files=()
          while IFS= read -r f; do profraw_files+=("$f"); done \
            < <(find build -name "*.profraw")
          "$LLVM_PREFIX/bin/llvm-profdata" merge -sparse "${profraw_files[@]}" -o build/coverage.profdata
          test_exe=$(find build -name 'jose_tests' -type f | head -1)
          "$LLVM_PREFIX/bin/llvm-cov" export "$test_exe" \
            -instr-profile=build/coverage.profdata \
            -format=lcov \
            "--ignore-filename-regex=(build/_deps|tests)/" \
            > build/coverage.lcov
          echo "COVERAGE_FILE=build/coverage.lcov" >> "$GITHUB_ENV"
          echo "COVERAGE_DATA_FILE=build/coverage.lcov" >> "$GITHUB_ENV"

      - name: Coverage report (ClangCL / llvm-cov instrumentation)
        if: matrix.coverage_tool == 'llvm-cov-instr' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $profrawFiles = Get-ChildItem -Path . -Recurse -Filter "*.profraw" |
                          Select-Object -ExpandProperty FullName
          $testExe = Get-ChildItem -Path build -Recurse -Filter jose_tests.exe |
                     Select-Object -First 1 -ExpandProperty FullName
          llvm-profdata merge -sparse $profrawFiles -o build/coverage.profdata
          llvm-cov export $testExe `
            -instr-profile=build/coverage.profdata `
            -format=lcov `
            "--ignore-filename-regex=(build[\\/]_deps|tests)[\\/]" `
            > build/coverage.lcov
          "COVERAGE_FILE=build/coverage.lcov" | `
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set coverage file (OpenCppCoverage)
        if: matrix.coverage_tool == 'opencppcoverage'
        shell: bash
        run: |
          echo "COVERAGE_FILE=build/coverage.xml" >> "$GITHUB_ENV"
          echo "COVERAGE_DATA_FILE=build/coverage.xml" >> "$GITHUB_ENV"

      - name: Upload raw coverage data
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.name }}
          path: ${{ env.COVERAGE_DATA_FILE }}

  # ── MinGW (MSYS2 UCRT64) ─────────────────────────────────────────────────
  build-mingw:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "MinGW GCC OpenSSL Debug"
            backend: OpenSSL
            build_type: Debug
            coverage: true
          - name: "MinGW GCC OpenSSL Release"
            backend: OpenSSL
            build_type: Release
            coverage: false
          - name: "MinGW GCC CNG Debug"
            backend: CNG
            build_type: Debug
            coverage: true
          - name: "MinGW GCC CNG Release"
            backend: CNG
            build_type: Release
            coverage: false

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-lcov

      - name: Configure CMake
        run: |
          EXTRA_ARGS=""
          if [[ "${{ matrix.coverage }}" == "true" ]]; then
            EXTRA_ARGS+=" -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage"
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DJOSE_BACKEND=${{ matrix.backend }} \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            $EXTRA_ARGS

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Coverage report (GCC / lcov)
        if: matrix.coverage
        run: |
          # MinGW ships lcov 1.x which does not know 'inconsistent' or 'unused';
          # use only the 'source' type which has been present since lcov 1.x.
          lcov --capture --directory build --output-file build/coverage.info --ignore-errors source
          lcov --remove build/coverage.info '/usr/*' '*/Catch2/*' '*/nlohmann*' \
               --output-file build/coverage.info
          lcov --list build/coverage.info

      - name: Upload raw coverage data
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.name }}
          path: build/coverage.info

  # ── Cygwin ────────────────────────────────────────────────────────────────
  build-cygwin:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    env:
      SHELLOPTS: igncr
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login -eo pipefail '{0}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Cygwin GCC OpenSSL Debug"
            build_type: Debug
            coverage: false
          - name: "Cygwin GCC OpenSSL Release"
            build_type: Release
            coverage: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: cmake ninja gcc-g++ libssl-devel

      - name: Configure CMake
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          EXTRA_ARGS=""
          if [[ "${{ matrix.coverage }}" == "true" ]]; then
            EXTRA_ARGS+=" -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage"
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DJOSE_BACKEND=OpenSSL \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            $EXTRA_ARGS

      - name: Build
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

  # ── Coverage summary (single pane of glass) ──────────────────────────────
  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [build-and-test, build-mingw, build-cygwin]
    steps:
      - name: Download all coverage data artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: false

      - name: Build coverage summary table
        shell: python3 {0}
        run: |
          import os, re, sys, glob, xml.etree.ElementTree as ET
          from pathlib import Path

          THRESHOLD = 85.0
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]

          def parse_lcov(path):
              """Return {filename: (lines_hit, lines_total)} from an lcov .info/.lcov file."""
              files = {}
              current = None
              lh = lt = 0
              for line in Path(path).read_text(errors="replace").splitlines():
                  if line.startswith("SF:"):
                      current = line[3:].strip()
                      lh = lt = 0
                  elif line.startswith("LH:"):
                      lh = int(line[3:])
                  elif line.startswith("LF:"):
                      lt = int(line[3:])
                  elif line == "end_of_record" and current:
                      files[current] = (lh, lt)
                      current = None
              return files

          def parse_cobertura(path):
              """Return {filename: (lines_hit, lines_total)} from a Cobertura XML."""
              files = {}
              tree = ET.parse(path)
              for cls in tree.iter("class"):
                  fname = cls.get("filename", "")
                  hits = sum(1 for l in cls.iter("line") if int(l.get("hits", 0)) > 0)
                  total = sum(1 for _ in cls.iter("line"))
                  if total:
                      files[fname] = (hits, total)
              return files

          def overall_pct(file_map):
              th = sum(t for _, t in file_map.values())
              hh = sum(h for h, _ in file_map.values())
              return 100.0 * hh / th if th else 0.0

          def low_files(file_map):
              out = []
              for fname, (h, t) in sorted(file_map.items()):
                  if t == 0:
                      continue
                  pct = 100.0 * h / t
                  # Only report project source files
                  base = os.path.basename(fname)
                  if pct < THRESHOLD:
                      out.append((fname, pct, h, t))
              return out

          rows = []
          any_fail = False

          for artifact_dir in sorted(Path("coverage-data").iterdir()):
              if not artifact_dir.is_dir():
                  continue
              # artifact name is "coverage-data-<matrix.name>"
              label = artifact_dir.name.removeprefix("coverage-data-")
              data_files = list(artifact_dir.rglob("*"))
              data_files = [f for f in data_files if f.is_file()]
              if not data_files:
                  rows.append((label, None, None, []))
                  continue
              data_file = data_files[0]
              try:
                  if data_file.suffix in (".info", ".lcov") or data_file.name.endswith(".info"):
                      file_map = parse_lcov(data_file)
                  elif data_file.suffix == ".xml":
                      file_map = parse_cobertura(data_file)
                  else:
                      # Try lcov first, fall back to cobertura
                      try:
                          file_map = parse_lcov(data_file)
                      except Exception:
                          file_map = parse_cobertura(data_file)
              except Exception as e:
                  rows.append((label, None, None, []))
                  continue

              if not file_map:
                  rows.append((label, None, None, []))
                  continue

              pct = overall_pct(file_map)
              low = low_files(file_map)
              if low or pct < THRESHOLD:
                  any_fail = True
              rows.append((label, pct, len(file_map), low))

          with open(summary_path, "w") as f:
              f.write("## Coverage Summary\n\n")
              f.write(f"Threshold: **{THRESHOLD:.0f}%** per file\n\n")
              f.write("| Configuration | Overall | Files | Status |\n")
              f.write("|---|---|---|---|\n")
              for label, pct, nfiles, low in rows:
                  if pct is None:
                      f.write(f"| {label} | ⚠️ no data | — | ⚠️ |\n")
                  else:
                      status = "✅" if not low and pct >= THRESHOLD else "❌"
                      f.write(f"| {label} | {pct:.1f}% | {nfiles} | {status} |\n")

              failing = [(l, low) for l, pct, nfiles, low in rows if low]
              if failing:
                  f.write("\n### Files below threshold\n\n")
                  f.write("| Configuration | File | Coverage |\n")
                  f.write("|---|---|---|\n")
                  for label, low in failing:
                      for fname, pct, h, t in low:
                          # Strip leading path components to show relative path
                          short = re.sub(r"^.*(src/|include/)", r"\1", fname)
                          f.write(f"| {label} | `{short}` | {pct:.1f}% ({h}/{t} lines) |\n")
              else:
                  f.write("\n✅ All files meet the coverage threshold.\n")

          if any_fail:
              print("::warning::Some configurations have files below the 85% coverage threshold. See the job summary.")

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find include src tests examples -name "*.cpp" -o -name "*.hpp" | \
            xargs clang-format --dry-run --Werror
